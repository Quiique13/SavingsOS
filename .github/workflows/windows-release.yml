name: Windows downloads

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/windows-release.yml'
      - 'desktop/**'
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/build-windows.mjs'
      - 'package*.json'
      - '*config*'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable app, and check packaged persistence
        run: npm run windows:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: savingsOS-Windows-x64
          path: |
            output/windows/savingsOS-Portable.exe
            output/windows/savingsOS-Setup.exe
            output/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: savingsOS-Windows-x64
          path: downloads
      - name: Publish GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" downloads/* --verify-tag --title "savingsOS $RELEASE_TAG" --generate-notes
