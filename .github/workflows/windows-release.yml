name: Windows downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: choco install nsis --no-progress -y
      - run: node scripts/build-windows.mjs --installer
      - run: npm run test:windows
      - uses: actions/upload-artifact@v4
        with:
          name: savingsOS-windows-x64
          path: |
            output/windows/*.exe
            output/windows/SHA256SUMS.txt
      - name: Attach Windows downloads to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Release tag does not match package.json" }
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "savingsOS $version" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME output/windows/*.exe output/windows/SHA256SUMS.txt
