<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/SOSLogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8faf6" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("savings-os-theme"); } catch {}
        const theme = saved === "light" || saved === "dark" ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111813" : "#f8faf6";
      })();
    </script>
    <title>savingsOS — A calmer place for your money</title>
    <meta name="description" content="Plan everyday, monthly, and annual expenses, track paid bills, and organize your accounts." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
